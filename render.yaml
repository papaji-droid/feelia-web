# Render Blueprint: Dashboard > New > Blueprint, tro toi repo nay.
# Tao 1 Postgres (free) + 1 web service (free). Du lieu nam trong Postgres, khong can Persistent Disk.
# Luu y goi free: Postgres bi xoa sau 30 ngay (nang len goi tra phi truoc han de giu du lieu),
# web service ngu sau 15 phut khong co truy cap, lan mo dau mat ~30 giay.
databases:
  - name: free-a-db
    plan: free
    databaseName: freea
    user: freea

services:
  - type: web
    name: free-a
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: free-a-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
